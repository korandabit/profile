theme: jekyll-theme-minimal
title: Mark Koranda
description: Thanks for stopping by.
github:
  is_project_page: false
plugins:
  - jekyll-feed
permalink: /blog/:year/:month/:day/:title/
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
# Repo files that are public on GitHub but not pages of the site.
# (Private working state never enters this repo at all -- see CLAUDE.md "Public / private".)
exclude:
  - docs
  - tools
  - CLAUDE.md
  - README.md
  - ledger.db
